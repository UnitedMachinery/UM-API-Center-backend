spring:
  application:
    name: um-api-center
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/um_api_center?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

mybatis:
  configuration:
    map-underscore-to-camel-case: true

um:
  security:
    require-https: ${REQUIRE_HTTPS:false}
  admin-session:
    cookie-name: UM_API_ADMIN_SESSION
    cookie-path: /api/admin
    ttl: PT8H
    cookie-secure: ${ADMIN_COOKIE_SECURE:false}
